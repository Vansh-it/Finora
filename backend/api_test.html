<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM API Tester — Finora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --canvas: #ffffff;
  --canvas-soft: #fafafa;
  --canvas-soft-2: #f5f5f5;
  --ink: #171717;
  --body: #4d4d4d;
  --mute: #888888;
  --hairline: #ebebeb;
  --hairline-strong: #a1a1a1;
  --accent: #0070f3;
  --accent-deep: #0761d1;
  --accent-soft: #d3e5ff;
  --error: #ee0000;
  --error-soft: #f7d4d6;
  --success: #0070f3;
  --success-soft: #d3e5ff;
  --warning: #f5a623;
  --warning-soft: #ffefcf;
  --violet: #7928ca;
  --cyan: #50e3c2;
  --pink: #ff0080;

  --shadow-l1: inset 0 0 0 1px rgb(0 0 0 / 0.06);
  --shadow-l2: 0 1px 1px rgb(0 0 0 / 0.05), 0 2px 2px rgb(0 0 0 / 0.1), inset 0 0 0 1px rgb(0 0 0 / 0.06);
  --shadow-l3: 0 2px 2px rgb(0 0 0 / 0.1), 0 8px 8px -8px rgb(0 0 0 / 0.1), inset 0 0 0 1px rgb(0 0 0 / 0.06);
  --shadow-l4: 0 2px 2px rgb(0 0 0 / 0.1), 0 8px 16px -4px rgb(0 0 0 / 0.1), inset 0 0 0 1px rgb(0 0 0 / 0.06);

  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

html { height: 100%; }

body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 20px;
  color: var(--ink);
  background: var(--canvas-soft);
  height: 100%;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01', 'ss02';
}

::selection { background: #171717; color: #f2f2f2; }

/* ── Nav ─────────────────────────────────────────────────────────────────── */
.nav {
  height: 48px;
  background: var(--canvas);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-logo {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.28px;
  color: var(--ink);
  text-decoration: none;
}
.nav-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  color: var(--mute);
  background: var(--canvas-soft);
  border: 1px solid var(--hairline);
  border-radius: 64px;
  padding: 2px 8px;
  line-height: 16px;
  letter-spacing: -0.28px;
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-link {
  font-size: 13px;
  font-weight: 500;
  color: var(--body);
  text-decoration: none;
  padding: 4px 10px;
  border-radius: 64px;
  transition: color 140ms ease, background 140ms ease;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}
.nav-link:hover { color: var(--ink); background: var(--canvas-soft); }
.nav-link.active { color: var(--ink); background: var(--canvas-soft-2); }

/* ── Layout ──────────────────────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 0 16px;
}

/* ── Provider Selector ───────────────────────────────────────────────────── */
.provider-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 0 12px;
  flex-shrink: 0;
}
.provider-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 4px;
  line-height: 16px;
  flex-shrink: 0;
}
.provider-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.provider-tab {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--body);
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: 64px;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 140ms ease;
  display: flex;
  align-items: center;
  gap: 6px;
  line-height: 20px;
  white-space: nowrap;
}
.provider-tab:hover {
  color: var(--ink);
  border-color: var(--hairline-strong);
}
.provider-tab.selected {
  color: var(--ink);
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
.provider-tab .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.provider-tab .dot.healthy { background: var(--cyan); }
.provider-tab .dot.rate-limited { background: var(--warning); }
.provider-tab .dot.error { background: var(--error); }
.provider-tab .dot.unconfigured { background: var(--hairline-strong); }
.provider-tab.selected .dot.healthy { background: var(--cyan); }
.provider-tab.selected .dot.rate-limited { background: var(--warning); }
.provider-tab.selected .dot.error { background: var(--error); }

.auto-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 4px;
  padding: 1px 5px;
  margin-left: 2px;
  line-height: 14px;
}

/* ── Status Bar ──────────────────────────────────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 0 12px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--hairline);
}
.status-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--mute);
}
.status-item .label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.status-item .value {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--body);
}
.status-item .value.ok { color: var(--cyan); }
.status-item .value.warn { color: var(--warning); }
.status-item .value.err { color: var(--error); }

/* ── Chat Area ───────────────────────────────────────────────────────────── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.message {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 85%;
  animation: msg-in 220ms ease both;
}
.message.user { align-self: flex-end; }
.message.assistant { align-self: flex-start; }

.message-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mute);
  display: flex;
  align-items: center;
  gap: 6px;
}
.message.user .message-meta { justify-content: flex-end; }
.message-meta .provider-tag {
  font-size: 10px;
  font-weight: 500;
  background: var(--canvas-soft-2);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 0 5px;
  line-height: 15px;
  color: var(--body);
}
.message-meta .time-tag {
  font-size: 10px;
}

.message-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 22px;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .message-bubble {
  background: var(--ink);
  color: white;
  border-bottom-right-radius: 4px;
}
.message.assistant .message-bubble {
  background: var(--canvas);
  color: var(--ink);
  border: 1px solid var(--hairline);
  border-bottom-left-radius: 4px;
  box-shadow: var(--shadow-l1);
}

.message-bubble code {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--canvas-soft-2);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 1px 5px;
}
.message.user .message-bubble code {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.2);
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--mute);
  padding: 40px 0;
}
.empty-state .icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--canvas);
  border: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow-l2);
}
.empty-state p {
  font-size: 14px;
  color: var(--mute);
  text-align: center;
  max-width: 320px;
  line-height: 22px;
}
.empty-state .hint {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--hairline-strong);
}

/* ── Typing indicator ────────────────────────────────────────────────────── */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 10px 14px;
  align-items: center;
}
.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--hairline-strong);
  animation: typing-bounce 1.2s ease-in-out infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* ── Input Bar ───────────────────────────────────────────────────────────── */
.input-bar {
  padding: 12px 0 20px;
  flex-shrink: 0;
}
.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  padding: 8px 8px 8px 16px;
  box-shadow: var(--shadow-l2);
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.input-wrapper:focus-within {
  border-color: var(--hairline-strong);
  box-shadow: var(--shadow-l3);
}
.input-wrapper textarea {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 22px;
  color: var(--ink);
  resize: none;
  min-height: 22px;
  max-height: 120px;
  padding: 2px 0;
}
.input-wrapper textarea::placeholder { color: var(--mute); }

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--ink);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 140ms ease, transform 140ms ease;
}
.send-btn:hover { opacity: 0.85; }
.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; }

.input-hint {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--hairline-strong);
}

/* ── Error toast ─────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: white;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: 8px;
  box-shadow: var(--shadow-l4);
  z-index: 100;
  opacity: 0;
  transition: transform 300ms cubic-bezier(0.16,1,0.3,1), opacity 200ms ease;
  pointer-events: none;
  max-width: 90vw;
  text-align: center;
}
.toast.visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
.toast.error {
  background: var(--error);
}

/* ── Animations ──────────────────────────────────────────────────────────── */
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }
.chat-area::-webkit-scrollbar-thumb:hover { background: var(--hairline-strong); }

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .nav { padding: 0 12px; }
  .main { padding: 0 12px; }
  .provider-bar { flex-wrap: wrap; }
  .provider-tabs { width: 100%; }
  .message { max-width: 95%; }
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <div class="nav-left">
    <a class="nav-logo" href="/">Finora</a>
    <span class="nav-badge">api tester</span>
  </div>
  <div class="nav-right">
    <button class="nav-link" onclick="refreshStatus()" title="Refresh provider status">Refresh</button>
    <a class="nav-link" href="/api/provider-status" target="_blank">Status</a>
  </div>
</nav>

<!-- Main -->
<div class="main">
  <!-- Provider Selector -->
  <div class="provider-bar">
    <span class="provider-label">Model</span>
    <div class="provider-tabs" id="providerTabs">
      <button class="provider-tab" data-provider="openai_oss" onclick="selectProvider('openai_oss')">
        <span class="dot unconfigured" id="dot-openai_oss"></span>
        GPT-OSS-120B
      </button>
      <button class="provider-tab" data-provider="nvidia_nemotron" onclick="selectProvider('nvidia_nemotron')">
        <span class="dot unconfigured" id="dot-nvidia_nemotron"></span>
        Nemotron
      </button>
      <button class="provider-tab" data-provider="muse_glimmer" onclick="selectProvider('muse_glimmer')">
        <span class="dot unconfigured" id="dot-muse_glimmer"></span>
        Muse Glimmer
      </button>
      <button class="provider-tab" data-provider="glm" onclick="selectProvider('glm')">
        <span class="dot unconfigured" id="dot-glm"></span>
        GLM 5.2
      </button>
      <button class="provider-tab selected" data-provider="" onclick="selectProvider('')">
        Auto
        <span class="auto-tag">failover</span>
      </button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <div class="status-item">
      <span class="label">Providers</span>
      <span class="value" id="statusProviders">—</span>
    </div>
    <div class="status-item">
      <span class="label">Active</span>
      <span class="value" id="statusActive">—</span>
    </div>
    <div class="status-item">
      <span class="label">Strategy</span>
      <span class="value" id="statusStrategy">—</span>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">⚡</div>
      <p>Send a message to test any of the connected LLM APIs.</p>
      <span class="hint">Select a provider above or use Auto failover</span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrapper">
      <textarea
        id="promptInput"
        rows="1"
        placeholder="Type a prompt..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" title="Send (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
    <div class="input-hint">
      <span>Enter to send · Shift+Enter for newline</span>
      <span id="charCount">0</span>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let selectedProvider = '';  // empty = auto-failover
let sending = false;
let providerStatus = {};
const messages = [];

// ── Provider display names ─────────────────────────────────────────────────
const PROVIDER_NAMES = {
  openai_oss: 'GPT-OSS-120B',
  nvidia_nemotron: 'Nemotron',
  muse_glimmer: 'Muse Glimmer',
  glm: 'GLM 5.2',
};

// ── Provider selection ─────────────────────────────────────────────────────
function selectProvider(name) {
  selectedProvider = name;
  document.querySelectorAll('.provider-tab').forEach(tab => {
    tab.classList.toggle('selected', tab.dataset.provider === name);
  });
}

// ── Status refresh ─────────────────────────────────────────────────────────
async function refreshStatus() {
  try {
    const res = await fetch('/api/provider-status');
    const data = await res.json();
    providerStatus = data;

    const available = data.providers.filter(p => p.available).length;
    document.getElementById('statusProviders').textContent = `${available}/${data.providers.length}`;
    document.getElementById('statusProviders').className = 'value' + (available > 0 ? ' ok' : ' err');

    document.getElementById('statusActive').textContent = data.active_provider || 'none';
    document.getElementById('statusActive').className = 'value' + (data.active_provider !== 'none' ? ' ok' : ' err');

    document.getElementById('statusStrategy').textContent = data.strategy || '—';

    // Update dots
    data.providers.forEach(p => {
      const dot = document.getElementById('dot-' + p.name);
      if (dot) {
        dot.className = 'dot';
        if (p.status === 'unconfigured') dot.classList.add('unconfigured');
        else if (p.status === 'rate_limited') dot.classList.add('rate-limited');
        else if (p.status === 'error') dot.classList.add('error');
        else dot.classList.add('healthy');
      }
    });
  } catch (e) {
    document.getElementById('statusProviders').textContent = 'err';
    document.getElementById('statusProviders').className = 'value err';
  }
}

// ── Chat rendering ─────────────────────────────────────────────────────────
function renderMessage(msg) {
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ' + msg.role;

  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  let metaHtml = '';
  if (msg.role === 'assistant') {
    const providerLabel = PROVIDER_NAMES[msg.provider] || msg.provider || '—';
    const timeLabel = msg.elapsed_ms != null ? `${msg.elapsed_ms}ms` : '';
    metaHtml = `<span class="provider-tag">${escapeHtml(providerLabel)}</span>`;
    if (timeLabel) metaHtml += `<span class="time-tag">${timeLabel}</span>`;
    metaHtml += `<span class="time-tag">${time}</span>`;
  } else {
    metaHtml = `<span class="time-tag">${time}</span>`;
  }

  div.innerHTML = `
    <div class="message-meta">${metaHtml}</div>
    <div class="message-bubble">${escapeHtml(msg.text)}</div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typingMsg';
  div.innerHTML = `
    <div class="message-meta">
      <span class="provider-tag">${selectedProvider ? PROVIDER_NAMES[selectedProvider] : 'Auto'}</span>
    </div>
    <div class="message-bubble">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

// ── Send message ───────────────────────────────────────────────────────────
async function send() {
  if (sending) return;

  const input = document.getElementById('promptInput');
  const prompt = input.value.trim();
  if (!prompt) return;

  sending = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  input.value = '';
  autoResize(input);
  updateCharCount();

  // Render user message
  renderMessage({ role: 'user', text: prompt });
  messages.push({ role: 'user', text: prompt });

  // Show typing
  showTyping();

  const startTime = performance.now();

  try {
    const body = { prompt };
    if (selectedProvider) body.provider = selectedProvider;

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();
    removeTyping();

    if (data.error) {
      renderMessage({
        role: 'assistant',
        text: 'Error: ' + data.error,
        provider: selectedProvider || 'auto',
      });
      showToast(data.error, true);
    } else {
      renderMessage({
        role: 'assistant',
        text: data.response,
        provider: data.model,
        elapsed_ms: data.elapsed_ms,
      });
      messages.push({ role: 'assistant', text: data.response, provider: data.model });
    }
  } catch (e) {
    removeTyping();
    renderMessage({
      role: 'assistant',
      text: 'Network error: ' + e.message,
      provider: selectedProvider || 'auto',
    });
    showToast('Network error: ' + e.message, true);
  }

  sending = false;
  sendBtn.disabled = false;
  input.focus();
  refreshStatus();
}

// ── Helpers ────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function updateCharCount() {
  const input = document.getElementById('promptInput');
  document.getElementById('charCount').textContent = input.value.length;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast visible' + (isError ? ' error' : '');
  setTimeout(() => { toast.className = 'toast'; }, 4000);
}

// ── Init ───────────────────────────────────────────────────────────────────
document.getElementById('promptInput').addEventListener('input', updateCharCount);
refreshStatus();
setInterval(refreshStatus, 30000);
</script>
</body>
</html>
